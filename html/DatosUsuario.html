<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Gabriel Kaakedjian, Gabriel Peña" />
    <meta name="description" content="Datos del usuario" />
    <title>Encuentra tu Cargador - Mi perfil</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="../assets/css/DatosUsuario.css" />
    <link rel="icon" href="../assets/img/ImagenLogoUax.jpg" type="image/jpeg">
</head>
<body>

    <!-- cabecera -->
    <header class="cabecera-sitio">
        <div class="cabecera-interior">
            <div class="marca">
                <div class="marca-icono">
                    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="18" cy="18" r="17" stroke="#1a56db" stroke-width="2"/>
                        <path d="M20 7L12 20h7l-3 9 11-13h-7l3-9z" fill="#1a56db"/>
                    </svg>
                </div>
                <div class="marca-texto">
                    <span class="marca-titulo">Encuentra tu Cargador</span>
                    <span class="marca-subtitulo">Red de puntos de carga eléctrica</span>
                </div>
            </div>
            <nav class="cabecera-nav">
                <a href="../html/Mapa.html" class="enlace-nav">Volver al mapa</a>
            </nav>
            <div class="cabecera-usuario">
                <span id="textoUsuario" title="Nombre de usuario"></span>
                <button onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <!-- main -->
    <main class="contenedor-principal">

        <div class="columna-izquierda">

            <!-- Datos personales -->
            <div class="tarjeta-seccion">
                <h2 class="seccion-titulo">Datos personales</h2>
                <div class="campo-lectura">
                    <span class="campo-etiqueta">Nombre</span>
                    <span class="campo-valor" id="datoNombre"></span>
                </div>
                <div class="campo-lectura">
                    <span class="campo-etiqueta">Apellido</span>
                    <span class="campo-valor" id="datoApellido"></span>
                </div>
                <div class="campo-lectura">
                    <span class="campo-etiqueta">Nombre de usuario</span>
                    <span class="campo-valor" id="datoNombreUsuario"></span>
                </div>
            </div>

            <!-- Cambiar contraseña -->
            <div class="tarjeta-seccion">
                <h2 class="seccion-titulo">Cambiar contraseña</h2>
                <div class="grupo-campo">
                    <label class="etiqueta-campo">Contraseña actual</label>
                    <div class="contenedor-entrada">
                        <input type="password" id="contrasenaActual" class="entrada-campo" placeholder="Introduce tu contraseña actual" />
                        <button type="button" class="boton-ojo" id="botonVerActual" aria-label="Mostrar contraseña">
                            <svg id="ojoAbiertoActual" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="ojoTachadoActual" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="oculto">
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="grupo-campo">
                    <label class="etiqueta-campo">Nueva contraseña</label>
                    <div class="contenedor-entrada">
                        <input type="password" id="contrasenaNueva" class="entrada-campo" placeholder="Mínimo 8 caracteres" />
                        <button type="button" class="boton-ojo" id="botonVerNueva" aria-label="Mostrar contraseña">
                            <svg id="ojoAbiertoNueva" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="ojoTachadoNueva" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="oculto">
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="grupo-campo">
                    <label class="etiqueta-campo">Confirmar nueva contraseña</label>
                    <div class="contenedor-entrada">
                        <input type="password" id="confirmarContrasena" class="entrada-campo" placeholder="Repite la nueva contraseña" />
                        <button type="button" class="boton-ojo" id="botonVerConfirmar" aria-label="Mostrar contraseña">
                            <svg id="ojoAbiertoConfirmar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="ojoTachadoConfirmar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="oculto">
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <p class="mensaje-contrasena oculto" id="mensajeContrasena"></p>
                <button class="boton-primario" id="botonCambiarContrasena">Guardar nueva contraseña</button>
            </div>

        </div>

        <div class="columna-derecha">

            <!-- Reservas -->
            <div class="tarjeta-seccion">
                <h2 class="seccion-titulo">Mis reservas</h2>
                <div class="barra-filtros">
                    <input type="text" id="buscarReserva" class="entrada-filtro" placeholder="Buscar por nombre..." />
                    <select id="filtroEstadoReserva" class="select-filtro">
                        <option value="">Todos los estados</option>
                        <option value="activa">Activa</option>
                        <option value="completada">Completada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>
                <div id="contenedorReservas">
                    <p class="texto-cargando">Cargando reservas...</p>
                </div>
            </div>

            <!-- Favoritos -->
            <div class="tarjeta-seccion">
                <h2 class="seccion-titulo">Mis favoritos</h2>
                <div class="barra-filtros">
                    <input type="text" id="buscarFavorito" class="entrada-filtro" placeholder="Buscar por nombre..." />
                    <select id="filtroTipoFavorito" class="select-filtro">
                        <option value="">Todos los tipos</option>
                        <option value="rapido">Carga rápida</option>
                        <option value="estandar">Carga estándar</option>
                        <option value="compatible">Carga lenta</option>
                    </select>
                    <select id="filtroEstadoFavorito" class="select-filtro">
                        <option value="">Todos los estados</option>
                        <option value="libre">Libre</option>
                        <option value="ocupado">Ocupado</option>
                        <option value="en_reparacion">En reparación</option>
                    </select>
                </div>
                <div id="contenedorFavoritos">
                    <p class="texto-cargando">Cargando favoritos...</p>
                </div>
            </div>

        </div>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/scriptsFrontend/RutasProtegidas.js"></script>
    <script src="../assets/scriptsFrontend/Api.js"></script>
    <script src="../assets/scriptsFrontend/DatosUsuario.js"></script>

</body>
</html>
