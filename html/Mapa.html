<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Gabriel Kaakedjian, Gabriel Peña" />
    <meta name="description" content="Mapa interactivo de cargadores" />
    <title>Encuentra tu Cargador — Mapa</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Leaflet CSS -->
    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="../assets/css/Mapa.css" />
</head>
<body data-rol="usuario" data-geo="true">

    <!-- Cabecera -->
    <header class="cabecera-mapa">
        <div class="cabecera-marca">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="18" cy="18" r="17" stroke="#1a56db" stroke-width="2"/>
                <path d="M20 7L12 20h7l-3 9 11-13h-7l3-9z" fill="#1a56db"/>
            </svg>
            <span>Encuentra tu Cargador</span>
        </div>
        <div class="cabecera-controles">
            <div class="cabecera-busqueda">
                <input type="text" id="inputBusqueda" placeholder="Buscar cargador..." />
                <button id="botonBusqueda">Buscar</button>
            </div>
            <div class="cabecera-filtros">
                <select id="filtroTipo">
                    <option value="">Todos los tipos</option>
                    <option value="rapido">Carga rápida</option>
                    <option value="estandar">Carga estándar</option>
                    <option value="compatible">Carga lenta</option>
                </select>
                <select id="filtroEstado">
                    <option value="">Todos los estados</option>
                    <option value="libre">Libre</option>
                    <option value="ocupado">Ocupado</option>
                    <option value="en_reparacion">En reparación</option>
                </select>
            </div>
        </div>
        <div class="cabecera-usuario">
            <a href="../html/DatosUsuario.html" class="enlace-perfil">Mi perfil</a>
            <button onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </header>

    <!-- main -->
    <main class="contenedor-mapa">

        <!-- Panel lateral de detalles (oculto por defecto) -->
        <div class="panel-detalle oculto" id="panelDetalle">
            <div class="panel-cabecera">
                <h2 class="panel-nombre" id="panelNombre"></h2>
                <button class="panel-cerrar" id="botonCerrarPanel">×</button>
            </div>
            <div class="panel-cuerpo">
                <div class="panel-fila">
                    <span class="panel-etiqueta">Estado</span>
                    <span class="panel-valor" id="panelEstado"></span>
                </div>
                <div class="panel-fila">
                    <span class="panel-etiqueta">Tipo</span>
                    <span class="panel-valor" id="panelTipo"></span>
                </div>
                <div class="panel-fila">
                    <span class="panel-etiqueta">Coste</span>
                    <span class="panel-valor" id="panelCoste"></span>
                </div>
                <div class="panel-fila">
                    <span class="panel-etiqueta">Tiempo est.</span>
                    <span class="panel-valor" id="panelTiempo"></span>
                </div>
                <div class="panel-fila">
                    <span class="panel-etiqueta">Dirección</span>
                    <span class="panel-valor" id="panelDireccion"></span>
                </div>
            </div>
            <div class="panel-botones">
                <button class="boton-reservar" id="botonReservar">Reservar plaza</button>
                <button class="boton-favorito" id="botonFavorito">Añadir a favoritos</button>
                <button class="boton-navegador" id="botonNavegador">Abrir en navegador</button>
                <button class="boton-incidencia" id="botonIncidencia">Reportar incidencia</button>
            </div>
        </div>

        <!-- Mapa -->
        <div id="mapa"></div>

        <!-- Leyenda -->
        <div class="leyenda">
            <div class="leyenda-fila">
                <span class="leyenda-punto leyenda-libre"></span>
                <span>Libre</span>
            </div>
            <div class="leyenda-fila">
                <span class="leyenda-punto leyenda-ocupado"></span>
                <span>Ocupado</span>
            </div>
            <div class="leyenda-fila">
                <span class="leyenda-punto leyenda-reparacion"></span>
                <span>En reparación</span>
            </div>
        </div>

    </main>

    <!-- Modal de reporte de incidencia -->
    <div class="fondo-modal oculto" id="fondoModalIncidencia">
        <div class="tarjeta-modal">
            <h3 class="modal-titulo">Reportar incidencia</h3>
            <p class="modal-subtitulo" id="modalNombreCargador"></p>
            <textarea id="textoIncidencia" placeholder="Describe el problema del cargador..."></textarea>
            <div class="modal-acciones">
                <button class="boton-cancelar-modal" id="botonCancelarIncidencia">Cancelar</button>
                <button class="boton-enviar-modal" id="botonEnviarIncidencia">Enviar reporte</button>
            </div>
            <p class="modal-mensaje oculto" id="mensajeIncidencia"></p>
        </div>
    </div>

    <!-- Modal de confirmación de reserva -->
    <div class="fondo-modal oculto" id="fondoModalReserva">
        <div class="tarjeta-modal">
            <h3 class="modal-titulo">Confirmar reserva</h3>
            <p class="modal-subtitulo" id="modalNombreReserva"></p>
            <p class="modal-texto">La reserva tendrá una duración máxima de 30 minutos. ¿Deseas confirmarla?</p>
            <div class="modal-acciones">
                <button class="boton-cancelar-modal" id="botonCancelarReserva">Cancelar</button>
                <button class="boton-enviar-modal" id="botonConfirmarReserva">Confirmar reserva</button>
            </div>
            <p class="modal-mensaje oculto" id="mensajeReserva"></p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="../assets/scriptsFrontend/RutasProtegidas.js"></script>
    <script src="../assets/scriptsFrontend/Api.js"></script>
    <script src="../assets/scriptsFrontend/Notificaciones.js"></script>
    <script src="../assets/scriptsFrontend/Mapa.js"></script>

</body>
</html>
